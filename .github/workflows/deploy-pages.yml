name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Concurrency: cancel in-flight runs of this workflow per ref so the
# latest push to main wins (older queued runs are dropped).
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # Mirror the local dev setup documented in .claude/directory.md: the
      # repo-root node_modules is a symlink into frontend/node_modules so
      # Vite/Vitest resolve packages from anywhere under the layered tree
      # (apps/, engine/, tools/). Git doesn't track symlinks here, so CI
      # has to recreate it before tests/build run.
      - name: Link node_modules at repo root
        run: ln -s frontend/node_modules node_modules

      - name: Run engine tests
        working-directory: frontend
        run: npm test

      - name: Build static site
        working-directory: frontend
        # Play (vs-bots / multiplayer) is retired-but-not-removed: the flow
        # is unfinished, so play.html is dropped from the deployed site.
        # Delete this env line to ship it again.
        env:
          EXCLUDE_PLAY: '1'
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
