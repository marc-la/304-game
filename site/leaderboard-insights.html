<!DOCTYPE html>
<html lang="en-AU">
<head>
  <title>304 — Insights</title>
  <meta name="description" content="Betting profiles, stone ledgers, and notable events at betting-sheet resolution.">

</head>
<body data-section="leaderboard">

<!-- @include partials/site-nav.html -->

<div class="lb-page">

  <div id="lb-loading" class="lb-loading"><p>Loading…</p></div>
  <div id="lb-error" class="lb-error" hidden>
    <p>Couldn’t load the leaderboard data. Try refreshing in a moment.</p>
  </div>

  <div id="lb-main" hidden>

    <header class="lb-strip">
      <nav class="lb-seg lb-seg--pages" aria-label="Leaderboard pages">
        <a class="lb-seg-item" href="leaderboard.html">Standings</a>
        <a class="lb-seg-item" href="leaderboard-history.html">History</a>
        <a class="lb-seg-item is-active" aria-current="page" href="leaderboard-insights.html">Insights</a>
      </nav>
      <span class="lb-updated" id="lb-updated"></span>
    </header>

    <h1 class="lb-title">Insights</h1>

    <div class="lb-ins">
      <section class="lb-ins-compass" aria-label="The compass field">
        <h2 class="lb-h">The compass field <span class="lb-h-sub">how high we bid × how often it lands</span></h2>
        <div id="lb-compass" class="lb-compass"></div>
      </section>

      <aside class="lb-ins-rail">
        <section aria-label="Finishing shapes">
          <h2 class="lb-h">How our revolutions end <span class="lb-h-sub">all-time</span></h2>
          <div id="lb-finishes" class="lb-finishes"></div>
        </section>
        <p id="lb-nulls" class="lb-nulls"></p>
      </aside>

      <section class="lb-ins-profiles" aria-label="Player profiles">
        <h2 class="lb-h">How each of us plays</h2>
        <div id="lb-profiles" class="lb-profiles"></div>
      </section>
    </div>

  </div>
</div>

<script type="module" src="js/theme.js"></script>
<script src="js/site-nav.js"></script>
<script type="module" src="js/leaderboard/insights.js"></script>
